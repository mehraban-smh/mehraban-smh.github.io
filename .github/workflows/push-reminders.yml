name: Comfort check-in reminders

# Every hour: decide who should get a check-in reminder and send it (switch/push/send.js), then, if anyone
# registered since the last run and is still waiting for approval, open one issue in this repository listing
# them (switch/push/notify.js). GitHub emails the owner about the issue; approving happens on the dashboard.
# The issue carries only the participant code, never a name or email.
#
# What starts it: the Supabase database, at the top of every hour, through the workflow_dispatch API (see
# switch/supabase-reminder-clock.sql). GitHub's own schedule below is only a backup: on the free runners it
# is delayed or dropped so often that in September 2026 it ran about every four hours. It stays off the top
# of the hour, which GitHub says is the busiest time. The sender reminds a phone at most once per clock
# hour, so the clock and the backup never double up.
# "Run workflow" with a participant code sends one reminder straight away, ignoring home hours (for
# testing). "Dry run" makes both steps log what they would do and change nothing.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      participant:
        description: "Send a test reminder now to this participant code, e.g. P07"
        required: false
        default: ""
      dry_run:
        description: "Only log what would be sent and which issues would be opened"
        type: boolean
        default: false

# contents: read to check out the repository; issues: write so notify.js can open issues.
permissions:
  contents: read
  issues: write

concurrency:
  group: push-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install web-push
        working-directory: switch/push
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Send reminders
        working-directory: switch/push
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE_PARTICIPANT: ${{ github.event.inputs.participant }}
        run: node send.js
      # Runs even when sending failed (a push problem should not delay an approval email).
      - name: Notify about new participants
        if: ${{ !cancelled() }}
        working-directory: switch/push
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node notify.js
