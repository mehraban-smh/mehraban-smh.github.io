<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="MouldCast: a week's warning of mould on the walls of your home, from its sensors and digital twin. First draft with demo data.">
<!-- iOS paints the standalone status bar with theme-color (one per scheme), so it matches the app's own surface -->
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171D25" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MouldCast">
<meta name="format-detection" content="telephone=no">
<title>MouldCast · damp and mould forecast</title>
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=1">
<script src="../config.js?v=1"></script>
<script src="../twin.js?v=1"></script>
</head>
<body>
<div class="stage">
  <div class="phone">
    <!-- the top strip: Back, where you are or the step of a flow with its progress bar, Close (filled in by app.js) -->
    <div class="top" id="top"></div>
    <div class="screen" id="screen"><noscript><p class="note">This app needs JavaScript. Please turn it on, or open the link in Safari or Chrome.</p></noscript></div>
    <!-- the four tabs (Home, Ask, Photos, More) -->
    <nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
    <!-- "Photo check saved" and other short messages -->
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <!-- the index explained, a driver, an earlier photo, a report: closed by its X, the backdrop, Back or Escape -->
    <div class="backdrop" id="backdrop" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>
  </div>
</div>
<script src="icons.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
