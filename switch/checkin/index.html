<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="HomePulse: home comfort check-ins for participants in the SWITCH home comfort study (Swansea University).">
<!-- iOS paints the standalone status bar with theme-color (one per scheme), so it matches the app's own surface.
     "default" keeps the clock legible; "black-translucent" would draw white text over our white surface in light mode. -->
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171D25" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HomePulse">
<meta name="format-detection" content="telephone=no">
<title>HomePulse · SWITCH home comfort check-in</title>
<link rel="manifest" href="manifest.webmanifest?v=16">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=16">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=16">
<link rel="stylesheet" href="art.css?v=16">
<link rel="stylesheet" href="game.css?v=16">
<script src="../config.js?v=16"></script>
<script src="../switch-api.js?v=16"></script>
</head>
<body>
<div class="stage">
  <div class="phone">
    <!-- the top strip: Back, the step or question count with its progress bar, Close or "Later" (filled in by app.js) -->
    <div class="top" id="top"></div>
    <div class="screen" id="screen"><noscript><p class="note">This app needs JavaScript. Please turn it on, or open the link in Safari or Chrome.</p><p class="note" lang="cy">Mae angen JavaScript ar yr ap hwn. Trowch ef ymlaen, neu agorwch y ddolen yn Safari neu Chrome.</p></noscript></div>
    <!-- the four tabs (Today, Race, My check-ins, Settings), shown once someone is signed in -->
    <nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
    <!-- "Check-in saved" with Undo, and other short messages -->
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <canvas class="confetti" id="confetti" aria-hidden="true" hidden></canvas>
    <!-- one check-in's details, the badges, how points work, the sign-out question: closed by its X, the backdrop, Back or Escape -->
    <div class="backdrop" id="backdrop" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>
  </div>
  <!-- testing panel, only with ?debug=1 -->
  <section class="panel" id="debug" aria-label="Testing panel" hidden></section>
</div>
<script src="icons.js?v=16"></script>
<script src="i18n.js?v=16"></script>
<script src="questions.js?v=16"></script>
<script src="game.js?v=16"></script>
<script src="app.js?v=16"></script>
</body>
</html>
