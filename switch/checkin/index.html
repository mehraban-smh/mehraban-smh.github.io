<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Half-hourly comfort check-ins for participants in the SWITCH personal thermal comfort study.">
<meta name="theme-color" content="#0E7B72">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Comfort">
<title>SWITCH Comfort Check-in</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=3">
<script src="../config.js"></script>
<script src="../switch-api.js"></script>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="top">
      <button class="back" id="back" aria-label="Back" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
      <div class="progress" id="progress"><i></i></div>
      <div class="count" id="count"></div>
    </div>
    <div class="screen" id="screen"></div>
    <canvas class="confetti" id="confetti" hidden></canvas>
  </div>

  <section class="panel" hidden>
    <h2>What gets stored</h2>
    <p class="sub">Testing panel, shown only with <code>?debug=1</code>. Every submitted check-in becomes one row. Rows marked <em>example</em> are seeded test data and are never synced.</p>
    <div class="controls">
      <label>Extended questions
        <select id="extMode">
          <option value="rotate">Rotate (recommended)</option>
          <option value="all">Ask all every time</option>
          <option value="none">Core only</option>
        </select>
      </label>
      <button class="chip" id="copyCsv">Copy as CSV</button>
      <button class="chip" id="reseed">Reset to example data</button>
      <button class="chip ghost" id="clearAll">Clear check-ins</button>
      <button class="chip ghost" id="forget">Forget who I am</button>
    </div>
    <div class="tablewrap" id="table"></div>
  </section>
</div>
<script src="icons.js?v=3"></script>
<script src="questions.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
