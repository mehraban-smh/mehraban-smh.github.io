<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Comfort check-ins for participants in the Home Comfort NY study (SUNY ESF).">
<!-- iOS paints the Home Screen app's status bar with theme-color; "default" keeps the clock dark on the light canvas. -->
<meta name="theme-color" content="#F3EFFE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Comfort">
<meta name="format-detection" content="telephone=no">
<title>Home Comfort NY check-in</title>
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<link rel="stylesheet" href="../brand.css?v=1">
<link rel="stylesheet" href="app.css?v=1">
<script src="../config.js?v=1"></script>
<script src="../api.js?v=1"></script>
<script src="../icons.js?v=1"></script>
</head>
<body class="bg-aurora">
<a class="skip-link" href="#main">Skip to content</a>
<div class="app">
  <!-- top bar of the check-in, the sign-up and sign-in: back, title, close or "Later" (filled in by app.js) -->
  <header class="appbar" id="appbar" hidden></header>
  <main class="wrap screen-wrap" id="main" tabindex="-1">
    <div id="screen" class="screen"><noscript><p class="note">This app needs JavaScript. Please turn it on, or open the link in Safari or Chrome.</p></noscript></div>
  </main>
</div>
<!-- the four main tabs (Today, My comfort, My home, Settings), shown once someone is signed in -->
<nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
<!-- "Check-in saved" with Undo, and other short messages -->
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<!-- one check-in's details (My comfort) and the sign-out question -->
<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"></dialog>
<canvas class="confetti" id="confetti" aria-hidden="true" hidden></canvas>
<!-- testing panel, only with ?debug=1 -->
<section class="wrap debug" id="debug" aria-label="Testing panel" hidden></section>
<script src="questions.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
